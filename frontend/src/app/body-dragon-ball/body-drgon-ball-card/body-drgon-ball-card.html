<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-6">
    @for(a of personajes; track a.id){
    <div class="overflow-hidden rounded-2xl bg-slate-900 border border-cyan-400 shadow-[0_0_20px_rgba(34,211,238,0.3)] transition
        duration-300 hover:scale-105 hover:shadow-[0_0_30px_rgba(34,211,238,0.6)]">

        <!-- Imagen -->
        <div class=" h-52 bg-gradient-to-br from-blue-900 via-slate-950 to-purple-900 flex items-center
            justify-center ">
           <img [src]="url + a.imgsrc" class="h-full object-cover"> 
        </div>
        <!-- Información -->
        <div class="p-4 text-slate-100">
            <h2 class="
                text-xl
                font-bold
                text-cyan-300
                ">
                {{a.nombre}}
            </h2>
            <p class="text-sm text-slate-300">
                {{a.raza}}
            </p>
            <div class="mt-3">
                <div class="flex justify-between mb-1">
                    <span class="text-xs">
                        POWER LEVEL
                    </span>
                    <span class="text-cyan-300">
                        {{a.poder}}
                    </span>
                </div>
                <div class="
                    h-2
                    bg-slate-700
                    rounded-full
                    ">
                    <div class="
                        h-2
                        w-[90%]
                        rounded-full
                        bg-gradient-to-r
                        from-cyan-400
                        to-purple-500
                        ">
                    </div>
                </div>
            </div>
            <p class="mt-4 text-sm">
                {{a.transformacion}}
            </p>
        </div>

        <!-- Botones -->
        <div class=" flex gap-2 p-4 border-t border-slate-700 ">
            <button 
            (click)="editar(a)"
            class=" flex-1 py-2 rounded-lg
                    bg-amber-500 
                    text-black font-semibold
                hover:bg-amber-400
                ">
                EDITAR
            </button>
            <button 
            (click)="eliminar(a)"
            class="
                flex-1
                py-2
                rounded-lg
                bg-red-600
                text-white
                font-semibold
                hover:bg-red-500
                ">
                ELIMINAR
            </button>
        </div>
    </div>
}
</div>
