<div class="m-8 flex flex-col gap-6">

    <div
        class="
        flex
        flex-col
        md:flex-row
        gap-4
        justify-between
        items-center
        bg-slate-900/80
        border
        border-cyan-400
        rounded-2xl
        p-6
        shadow-[0_0_20px_rgba(34,211,238,0.3)]
        "
    >

        <div class="flex gap-3 w-full md:w-auto">

            <input
                type="text"
                placeholder="Buscar personaje..."
                [(ngModel)]="buscar"
                class="
                bg-slate-950
                text-cyan-300
                border
                border-cyan-500
                rounded-xl
                px-4
                py-3
                w-80
                outline-none
                focus:ring-2
                focus:ring-cyan-400
                "
            >

            <button
                class="
                bg-cyan-500
                text-slate-950
                font-bold
                px-5
                rounded-xl
                hover:bg-cyan-400
                transition
                "
            >
                BUSCAR
            </button>

        </div>


        <button
            onclick="document.getElementById('modal').showModal()"
            class="
            bg-gradient-to-r
            from-purple-500
            to-cyan-500
            text-white
            font-bold
            px-6
            py-3
            rounded-xl
            shadow-[0_0_15px_rgba(34,211,238,0.5)]
            hover:scale-105
            transition
            "
        >
            + NUEVO PERSONAJE
        </button>

    </div>


    <dialog
        id="modal"
        class="
        bg-slate-900
        text-white
        border
        border-cyan-400
        rounded-2xl
        p-0
        backdrop:bg-black/70
        "
    >

        <div class="p-6 w-[500px]">

            <h2
                class="
                text-2xl
                font-bold
                text-cyan-300
                mb-6
                "
            >
                REGISTRO DE PERSONAJE
            </h2>

            <div class="space-y-4">

                <input
                    type="text"
                    placeholder="Nombre"
                    [(ngModel)]="nombre"
                    class="
                    w-full
                    bg-slate-800
                    border
                    border-cyan-500
                    rounded-lg
                    p-3
                    "
                >

                <input
                    type="text"
                    placeholder="Raza"
                    [(ngModel)]="raza"
                    class="
                    w-full
                    bg-slate-800
                    border
                    border-cyan-500
                    rounded-lg
                    p-3
                    "
                >

                <input
                    type="text"
                    placeholder="Transfromacion"
                    [(ngModel)]="transformacion"
                    class="
                    w-full
                    bg-slate-800
                    border
                    border-cyan-500
                    rounded-lg
                    p-3
                    "
                >

                <input
                    type="number"
                    placeholder="Nivel de poder"
                    [(ngModel)]="poder"
                    class="
                    w-full
                    bg-slate-800
                    border
                    border-cyan-500
                    rounded-lg
                    p-3
                    "
                >

                <input
                    (change)="onFileSelected($event)"
                    type="file"
                    class="
                    w-full
                    text-cyan-300
                    "
                >

            </div>

            <div class="flex justify-end gap-3 mt-6">

                <button
                    onclick="document.getElementById('modal').close()"
                    class="
                    px-5
                    py-2
                    bg-red-600
                    rounded-lg
                    "
                >
                    CANCELAR
                </button>

                <button
                    class="
                    px-5
                    py-2
                    bg-cyan-500
                    text-slate-950
                    font-bold
                    rounded-lg
                    "
                    (click)="agregarPersonaje()"
                >
                    GUARDAR
                </button>

            </div>

        </div>

    </dialog>

</div>

<app-body-drgon-ball-card></app-body-drgon-ball-card>
